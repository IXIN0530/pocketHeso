name: PocketHeso
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    # 一元管理する値（spec/10-architecture）
    BUNDLE_PREFIX: com.ixin0530
    DEVELOPMENT_TEAM: ""
    APP_GROUP: group.$(BUNDLE_PREFIX).pocketheso
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  PachinkoCore:
    path: Packages/PachinkoCore
  PachinkoShared:
    path: Packages/PachinkoShared
  PachinkoPresentation:
    path: Packages/PachinkoPresentation

targets:
  PocketHeso:
    type: application
    platform: iOS
    sources: [App/Sources]
    dependencies:
      - package: PachinkoCore
      - package: PachinkoShared
      - package: PachinkoPresentation
      - target: PocketHesoWidgets
      - target: PocketHesoNotificationContent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).pocketheso
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PocketHeso
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    scheme: {}

  PocketHesoWidgets:
    type: app-extension
    platform: iOS
    sources: [Extensions/Widgets/Sources]
    dependencies:
      - package: PachinkoCore
      - package: PachinkoShared
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).pocketheso.widgets
    info:
      path: Extensions/Widgets/Info.plist
      properties:
        CFBundleDisplayName: PocketHeso Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  PocketHesoNotificationContent:
    type: app-extension
    platform: iOS
    sources: [Extensions/NotificationContent/Sources]
    dependencies:
      - package: PachinkoShared
      - package: PachinkoPresentation
      - sdk: UserNotifications.framework
      - sdk: UserNotificationsUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).pocketheso.notificationcontent
    info:
      path: Extensions/NotificationContent/Info.plist
      properties:
        CFBundleDisplayName: PocketHeso Notification
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory: HOT_EVENT
            UNNotificationExtensionInitialContentSizeRatio: 0.5
            UNNotificationExtensionDefaultContentHidden: false
